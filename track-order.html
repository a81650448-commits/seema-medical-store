<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order | Seema Medical Store</title>
<link rel="stylesheet" href="style.css?v=20260820-02">
<style>
.page-wrap{max-width:900px;margin:50px auto;padding:0 20px}.tracking-box{background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.form-grid label{display:flex;flex-direction:column;gap:7px;font-weight:700}.form-grid input{padding:13px;border:1px solid #d7e2dd;border-radius:10px;font:inherit}.tracking-card{margin-top:25px;padding:22px;border-radius:14px;background:#f3f8f5}.tracking-status{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0}.tracking-status div{text-align:center;font-size:12px;color:#89958f}.tracking-status span{display:block;font-size:24px;margin-bottom:5px}.tracking-status .completed{color:#087443}.back{display:inline-block;margin-bottom:20px;color:#087443;font-weight:800;text-decoration:none}.auto-tracking-note{padding:12px 15px;border-radius:10px;background:#edf7f2;color:#087443;font-weight:700;margin-top:15px}@media(max-width:650px){.form-grid,.tracking-status{grid-template-columns:1fr}.page-wrap{margin:25px auto}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo">✚</div><div><strong>SEEMA</strong><span>MEDICAL STORE</span></div></div><nav><a href="index.html#products">Medicines</a><a href="index.html#contact">Contact</a></nav></header>
<main class="page-wrap"><a class="back" href="index.html">← Back to Store</a><div class="tracking-box"><p class="eyebrow">ORDER STATUS</p><h1>📦 Track Your Order</h1><p id="trackingIntro">Enter your Order ID and mobile number to check the current status.</p><div class="form-grid" id="trackingForm"><label>Order ID<input id="trackingOrderId" placeholder="e.g. SMS-23733805"></label><label>Mobile Number<input id="trackingPhone" type="tel" placeholder="10-digit mobile number"></label></div><button class="primary" id="trackButton" type="button" onclick="trackOrder()">🔍 Track Order</button><div id="autoTrackingNote"></div><div id="trackingResult"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260820-05"></script>
<script>
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function trackOrder(){const id=document.getElementById('trackingOrderId').value.trim(),phone=document.getElementById('trackingPhone').value.trim(),r=document.getElementById('trackingResult');if(!id||!phone){r.innerHTML='<p>Please enter Order ID and mobile number.</p>';return}r.innerHTML='<p>Checking your order...</p>';try{const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data,error}=await db.rpc('track_order',{p_order_id:id,p_phone:phone});if(error)throw error;if(!data||!data.length){r.innerHTML='<p><strong>Order not found.</strong><br>Check the Order ID and mobile number.</p>';return}const o=data[0],statuses=['Pending','Confirmed','Packed','Out for Delivery','Delivered'],idx=statuses.indexOf(o.status);r.innerHTML='<div class="tracking-card"><h2>Order '+esc(o.order_id)+'</h2><p><strong>Customer:</strong> '+esc(o.customer_name)+'</p><p><strong>Total:</strong> ₹'+Number(o.total||0).toFixed(2)+'</p><p><strong>Payment:</strong> '+esc(o.payment_method)+'</p><div class="tracking-status">'+statuses.map((s,i)=>'<div class="'+(i<=idx?'completed':'')+'"><span>'+(i<=idx?'✓':'○')+'</span><strong>'+s+'</strong></div>').join('')+'</div><h3>Current Status: '+esc(o.status)+'</h3></div>'}catch(e){r.innerHTML='<p>Tracking error: '+esc(e.message||'Unable to check order.')+'</p>'}}
function autoTrackFromMyOrders(){const params=new URLSearchParams(window.location.search),id=params.get('order'),phone=params.get('phone');if(!id||!phone)return;document.getElementById('trackingOrderId').value=id;document.getElementById('trackingPhone').value=phone;document.getElementById('trackingIntro').textContent='Your order has been selected automatically.';document.getElementById('trackingForm').style.display='none';document.getElementById('trackButton').style.display='none';document.getElementById('autoTrackingNote').innerHTML='<div class="auto-tracking-note">✓ Tracking your selected order automatically</div>';trackOrder()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',autoTrackFromMyOrders);else autoTrackFromMyOrders();
</script>
</body></html>
