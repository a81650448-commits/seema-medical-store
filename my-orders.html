<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Aditya Medical Store</title>
<link rel="stylesheet" href="style.css?v=20260820-03">
<style>
.page-wrap{max-width:1000px;margin:45px auto;padding:0 20px}.orders-box{background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.order-card{background:#f4f8f6;border:1px solid #dce8e2;border-radius:15px;padding:20px;margin:16px 0}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.badge{padding:7px 12px;border-radius:999px;background:#e5f2eb;color:#087443;font-weight:800;font-size:13px}.line{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid #dde7e2}.line:last-child{border-bottom:0}.muted{color:#69766f}.back{display:inline-block;margin-bottom:20px;color:#087443;font-weight:800;text-decoration:none}.login-note{padding:18px;border-radius:12px;background:#fff7df}.error-note{padding:18px;border-radius:12px;background:#fff1f0;color:#9d2f2a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.loading{padding:18px;border-radius:12px;background:#f4f8f6;color:#245044}@media(max-width:600px){.page-wrap{margin:25px auto}.order-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo">✚</div><div><strong>ADITYA</strong><span>MEDICAL STORE</span></div></div><nav><a href="index.html#products">Medicines</a><a href="track-order.html">Track Order</a><a href="index.html#contact">Contact</a></nav></header>
<main class="page-wrap"><a class="back" href="index.html">← Back to Store</a><div class="orders-box"><p class="eyebrow">CUSTOMER ACCOUNT</p><h1>📋 My Orders</h1><p class="muted">Your medicine orders, prices, payment details and delivery information.</p><div id="ordersContent"><div class="loading">Connecting to your customer account...</div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260820-05"></script>
<script>
(function(){
 const box=document.getElementById('ordersContent');
 const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
 const money=v=>'₹'+Number(v||0).toFixed(2);
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 async function getCustomerSession(db){
   for(let i=0;i<3;i++){
     const {data,error}=await db.auth.getSession();
     if(error) throw error;
     if(data&&data.session) return data.session;
     await wait(700);
   }
   const refreshed=await db.auth.refreshSession();
   if(refreshed.error) return null;
   return refreshed.data?.session||null;
 }
 async function loadMyOrders(){
   box.innerHTML='<div class="loading">Connecting to your customer account...</div>';
   try{
     if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY) throw new Error('Supabase configuration is missing.');
     const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
     const session=await getCustomerSession(db);
     const user=session?.user;
     if(!user){
       box.innerHTML='<div class="login-note"><strong>Please login to view your orders.</strong><br><br><a class="primary" href="index.html">Go to Customer Login</a></div>';
       return;
     }
     box.innerHTML='<div class="loading">Loading orders for <strong>'+esc(user.user_metadata?.full_name||user.email||'your account')+'</strong>...</div>';
     const {data,error}=await db.from('orders').select('order_id,customer_name,phone,address,items,total,payment_method,status,created_at').eq('user_id',user.id).order('created_at',{ascending:false});
     if(error) throw error;
     if(!data||!data.length){
       box.innerHTML='<div class="login-note"><strong>No orders are linked to this customer account yet.</strong><br><br>Place a new medicine order while logged in and it will appear here automatically.</div>';
       return;
     }
     box.innerHTML=data.map(o=>{
       const items=Array.isArray(o.items)?o.items:[];
       return '<article class="order-card"><div class="order-head"><div><h3>'+esc(o.order_id)+'</h3><span class="muted">'+(o.created_at?new Date(o.created_at).toLocaleString('en-IN'):'')+'</span></div><span class="badge">'+esc(o.status)+'</span></div><div>'+items.map(x=>'<div class="line"><span>'+esc(x.name)+' × '+Number(x.qty||0)+'</span><strong>'+money((Number(x.price)||0)*(Number(x.qty)||0))+'</strong></div>').join('')+'</div><p><strong>Total:</strong> '+money(o.total)+' &nbsp; <strong>Payment:</strong> '+esc(o.payment_method||'Not specified')+'</p><p><strong>Delivery:</strong> '+esc(o.address||'Not specified')+'</p><div class="actions"><a class="primary" href="track-order.html?order='+encodeURIComponent(o.order_id)+'&phone='+encodeURIComponent(o.phone||'')+'">📦 Track Order</a></div></article>';
     }).join('');
   }catch(e){
     console.error('MY ORDERS ERROR',e);
     box.innerHTML='<div class="error-note"><strong>Unable to load My Orders.</strong><br>'+esc(e.message||'Unknown error')+'<div class="actions"><button class="primary" type="button" onclick="window.loadMyOrders()">↻ Try Again</button><a class="secondary" href="index.html">Back to Store</a></div></div>';
   }
 }
 window.loadMyOrders=loadMyOrders;
 loadMyOrders();
})();
</script>
</body></html>
