<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Customer Profile | Aditya Medical Store</title><link rel="stylesheet" href="style.css?v=20260822-01"><style>body{background:#f4f7f6}.wrap{max-width:1200px;margin:30px auto;padding:0 20px}.topbar2{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.profile{background:#123b2a;color:#fff;border-radius:16px;padding:24px;margin-bottom:20px}.profile h1{margin:0 0 8px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat2,.card2{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 14px #00000010}.stat2 strong{display:block;font-size:25px;margin-top:6px}.section2{margin-bottom:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{background:#f8fafc}.pill{padding:4px 8px;border-radius:20px;background:#eef2ff;font-size:12px}.empty{padding:18px;color:#667085}.back{display:inline-block;color:#fff;text-decoration:none;font-weight:700}.bill-btn{border:0;border-radius:7px;padding:7px 10px;font-weight:700;cursor:pointer;background:#123b2a;color:#fff}@media(max-width:750px){.summary{grid-template-columns:1fr 1fr}.table{min-width:850px}.table-wrap{overflow:auto}}@media(max-width:500px){.summary{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="topbar2"><a class="back" href="admin.html">← Back to Admin Panel</a><strong>ADITYA MEDICAL STORE</strong></div><div id="content"><div class="card2">Loading customer profile...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260822-01"></script><script>(async function(){const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=v=>'₹'+Number(v||0).toFixed(2);const content=document.getElementById('content');const params=new URLSearchParams(location.search),phone=params.get('phone')||'',name=params.get('name')||'Customer';if(!phone&&!name){content.innerHTML='<div class="card2">Customer not specified.</div>';return}try{const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const [or,ar]=await Promise.all([db.from('orders').select('*').or(phone?`phone.eq.${phone},customer_name.ilike.${name}`:`customer_name.ilike.${name}`).order('created_at',{ascending:false}),db.from('appointments').select('*').or(phone?`phone.eq.${phone},patient_name.ilike.${name}`:`patient_name.ilike.${name}`).order('appointment_date',{ascending:false}).order('appointment_time',{ascending:false})]);const orders=or.error?[]:(or.data||[]),appts=ar.error?[]:(ar.data||[]);const bills=(()=>{try{return JSON.parse(localStorage.getItem('seema_medical_bills_v1')||'[]')}catch(e){return[]}})().filter(b=>{const p=String(b.phone||'').replace(/\D/g,'');return phone&&p===String(phone).replace(/\D/g,'')||String(b.customer||'').toLowerCase()===String(name).toLowerCase()});const total=orders.reduce((s,o)=>s+Number(o.total||0),0);const billTotal=bills.reduce((s,b)=>s+Number(b.total||0),0);const customer=orders[0]||appts[0]||{customer_name:name,phone:phone,address:''};content.innerHTML=`<div class="profile"><a class="back" href="admin.html">← Admin Panel</a><h1>👤 ${esc(customer.customer_name||customer.patient_name||name)}</h1><div>📱 ${esc(customer.phone||phone||'Not available')} &nbsp; | &nbsp; 📍 ${esc(customer.address||'Not available')}</div></div><div class="summary"><div class="stat2">Orders<strong>${orders.length}</strong></div><div class="stat2">Order Value<strong>${money(total)}</strong></div><div class="stat2">Appointments<strong>${appts.length}</strong></div><div class="stat2">Bills<strong>${bills.length}</strong></div></div><div class="card2 section2"><h2>📦 Order History</h2>${orders.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Medicines</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${esc(o.order_id)}</b></td><td>${Array.isArray(o.items)?o.items.map(i=>esc(i.name)+' × '+Number(i.qty||0)).join('<br>'):'—'}</td><td>${money(o.total)}</td><td>${esc(o.payment_method||'—')}</td><td><span class="pill">${esc(o.status)}</span></td><td>${o.created_at?new Date(o.created_at).toLocaleString('en-IN'):''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No orders found.</div>'}</div><div class="card2 section2"><h2>🩺 Appointment History</h2>${appts.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Appointment</th><th>Doctor</th><th>Date & Time</th><th>Reason</th><th>Status</th><th>Notes</th></tr></thead><tbody>${appts.map(a=>`<tr><td>${esc(a.appointment_id)}</td><td>${esc(a.doctor||'—')}</td><td>${esc(a.appointment_date||'')} ${esc(String(a.appointment_time||'').slice(0,5))}</td><td>${esc(a.reason||'—')}</td><td><span class="pill">${esc(a.status||'—')}</span></td><td>${esc(a.admin_notes||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No appointments found.</div>'}</div><div class="card2 section2"><h2>🧾 Bill History</h2>${bills.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Type</th><th>Amount</th><th>Payment</th><th>Date</th><th>Action</th></tr></thead><tbody>${bills.map((b,i)=>`<tr><td>${esc(b.invoice)}</td><td>${esc(b.type)}</td><td>${money(b.total)}</td><td>${esc(b.payment||'—')}</td><td>${b.date?new Date(b.date).toLocaleString('en-IN'):''}</td><td><button class="bill-btn" onclick="printBill(${i})">Print</button></td></tr>`).join('')}</tbody></table></div><p><b>Total billed:</b> ${money(billTotal)}</p>`:'<div class="empty">No bills found on this browser.</div>'}</div>`;window.profileBills=bills;window.printBill=function(i){const b=window.profileBills[i];if(!b)return;const rows=(b.items||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${Number(x.qty||0)}</td><td>${money(x.price)}</td><td>${money(Number(x.price||0)*Number(x.qty||0))}</td></tr>`).join('');const w=window.open('','_blank','width=800,height=900');if(!w)return;w.document.write(`<html><head><title>${esc(b.invoice)}</title><style>body{font-family:Arial;margin:30px}h1{text-align:center}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd}.total{text-align:right;font-size:20px;font-weight:bold;margin-top:20px}</style></head><body><h1>ADITYA MEDICAL STORE</h1><div style="text-align:center">Medicine Sales Invoice</div><p><b>Invoice:</b> ${esc(b.invoice)}<br><b>Customer:</b> ${esc(b.customer)}<br><b>Mobile:</b> ${esc(b.phone||'—')}<br><b>Payment:</b> ${esc(b.payment||'—')}</p><table><tr><th>Medicine</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${rows}</table><div class="total">Grand Total: ${money(b.total)}</div><script>window.onload=function(){window.print()}<\/script></body></html>`);w.document.close()};}catch(e){content.innerHTML='<div class="card2"><b>Unable to load customer profile.</b><br>'+esc(e.message||e)+'</div>'}})();</script></body></html>
